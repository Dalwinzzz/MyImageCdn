<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="format-detection" content="telephone=no">
<title>国庆出行 · 沪宁甬</title>
<meta name="description" content="国庆 7 天：杭州 → 上海 → 南京 → 宁波 → 杭州，行程、车票住宿、地图与出行须知。">
<link rel="stylesheet" href="/libs/leaflet/leaflet.css">
<style>
:root{
  --bg:#0e0e10; --panel:#131315; --card:#1b1b1e; --card2:#222226; --line:#2a2a2f;
  --text:#ecebe8; --muted:#8d8c92; --dim:#5d5c62;
  --accent:#f5a54a; --accent2:#ffbf73; --accent-bg:rgba(245,165,74,.14);
  --radius:18px; --nav-w:76px; --panel-w:470px;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);letter-spacing:.02em}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) var(--panel-w) 1fr;height:100vh;height:100dvh}
.nav{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0;border-right:1px solid #1c1c20;background:#0b0b0d}
.nav button{width:58px;padding:9px 0 7px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;transition:.2s}
.nav button svg{width:21px;height:21px}
.nav button.on{background:#1f1f23;color:var(--accent)}
.nav button:hover{color:var(--text)}
.panel{overflow-y:auto;overflow-x:hidden;padding:20px 22px 40px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.mapwrap{position:relative;padding:12px 12px 12px 0}
#map{width:100%;height:100%;border-radius:22px;background:#1a1b1e;overflow:hidden}
.map-chip{position:absolute;z-index:500;top:26px;left:16px;background:rgba(14,14,16,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid #2c2c31;border-radius:999px;padding:6px 14px;font-size:12px;pointer-events:none}
.map-chip b{color:var(--accent);font-weight:600;margin-right:6px}
.map-toggle{display:none}

/* dark tiles: 高德底图反色 */
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.82) contrast(.92) saturate(.55)}
.leaflet-container{font-family:inherit;background:#1a1b1e}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:#777!important;font-size:10px}
.leaflet-control-attribution a{color:#999!important}
.leaflet-control-zoom a{background:#1c1c20!important;color:#ccc!important;border-color:#2c2c31!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1c1c20;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:12px 14px;font-size:13px}
.pop-t{font-weight:600;margin-bottom:2px}
.pop-s{color:var(--muted);font-size:12px;margin-bottom:8px}
.pop-a{display:inline-block;background:var(--accent);color:#1a1206!important;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
.pin{width:26px;height:26px;border-radius:50%;background:#2a2a2f;border:2px solid #e9e4dc;color:#fff;font:600 12px/22px var(--mono);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pin.on{background:var(--accent);color:#1a1206;border-color:#fff2e0;box-shadow:0 0 0 6px rgba(245,165,74,.3),0 0 18px rgba(245,165,74,.6);transform:scale(1.18)}
.pin.city{width:auto;padding:0 10px;border-radius:999px;font:600 12px/22px inherit;white-space:nowrap}

/* ---------- common ---------- */
.eyebrow{font-size:12px;color:var(--muted)}
.h1{font-size:32px;font-weight:800;letter-spacing:.02em;margin:2px 0 4px}
.h2{font-size:18px;font-weight:700;margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between}
.h2 small{font-size:12px;font-weight:400;color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);vertical-align:middle}
.tag.gray{background:#26262a;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* day pills */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:2px 22px 4px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border-radius:999px;padding:6px 14px;text-align:left;color:var(--muted);font-size:13px;line-height:1.25;transition:.2s}
.pill small{display:block;font:10px var(--mono);opacity:.75}
.pill.on{background:#f3ede4;color:#141414;font-weight:600}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:250px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--g)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.72))}
.hero .emo{position:absolute;right:-6px;top:-10px;font-size:130px;opacity:.22;z-index:-1;line-height:1;filter:saturate(.7)}
.hero .meta{font-size:12px;color:var(--accent2);font-family:var(--mono)}
.hero .title{font-size:30px;font-weight:800;margin:4px 0 6px}
.hero .desc{font-size:13px;color:#d8d5cf;opacity:.9}
.stat{margin-top:12px;background:var(--card);border-radius:14px;padding:10px 14px;display:inline-flex;gap:18px}
.stat div b{display:block;font:600 18px var(--mono)}
.stat div span{font-size:11px;color:var(--muted)}

/* schedule */
.sched{position:relative;margin-top:6px}
.sched::before{content:"";position:absolute;left:62px;top:14px;bottom:14px;width:1px;background:var(--line)}
.it{display:grid;grid-template-columns:52px 20px 1fr auto;gap:0 8px;align-items:start;padding:11px 0;width:100%;text-align:left;border-radius:12px}
.it:hover .it-t{color:var(--accent2)}
.it-time{font:12px/20px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.it-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);background:var(--bg);margin:6px auto 0;position:relative;z-index:1}
.it.now .it-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(245,165,74,.25)}
.it.done{opacity:.45}
.it-t{font-size:14px;line-height:20px;transition:color .2s}
.it-s{font-size:12px;color:var(--muted);margin-top:2px}
.it-n{flex:none;width:22px;height:22px;border-radius:50%;background:#26262a;font:600 11px/22px var(--mono);text-align:center;color:var(--muted);margin-top:0}
.it-ico{font-size:22px;line-height:22px;width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center}
.empty{border:1px dashed #333;border-radius:16px;padding:22px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:22px;margin-bottom:4px;font-family:var(--mono)}

/* today */
.today-card{position:relative;border-radius:24px;overflow:hidden;min-height:380px;display:flex;flex-direction:column;padding:20px;isolation:isolate}
.today-card::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--g)}
.today-card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 35%,rgba(0,0,0,.78))}
.today-card .emo{position:absolute;right:-10px;top:70px;font-size:170px;opacity:.2;z-index:-1;line-height:1}
.cd-l{font-size:12px;display:flex;align-items:center;gap:6px}
.cd-l::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.cd{font:300 50px/1.1 var(--mono);margin-top:6px;letter-spacing:.01em}
.cd small{font-size:17px;margin:0 8px 0 2px;font-family:inherit}
.feat{margin-top:auto}
.feat .meta{font:12px var(--mono);color:var(--accent2)}
.feat .t{font-size:24px;font-weight:800;margin:4px 0}
.feat .s{font-size:13px;color:#d8d5cf}
.carousel{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.dots{display:flex;gap:4px}
.dots i{width:4px;height:4px;border-radius:2px;background:#444;transition:.25s}
.dots i.on{width:18px;background:var(--accent)}
.cbtn{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.cbtn svg{width:16px;height:16px}

/* tickets */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:22px;bottom:0;width:1px;background:linear-gradient(var(--accent),#3a3a3f 30%)}
.tl-d{position:relative;margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
.tl-d::before{content:"";position:absolute;left:-26px;top:.45em;width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);background:var(--bg)}
.tl-d b{font:500 30px var(--mono)}
.tl-d.past{opacity:.5}
.leg{margin-bottom:12px}
.leg .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:10px}
.leg .hd span{font-size:12px;font-weight:400;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.seg .tm{font:500 26px var(--mono)}
.seg .st{font-size:13px;font-weight:600;margin-top:-2px}
.seg .r{text-align:right}
.train{background:var(--accent-bg);color:var(--accent);font:600 11px var(--mono);padding:3px 9px;border-radius:999px;white-space:nowrap}
.notes{margin:12px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);list-style:none}
.notes li{font-size:12px;color:var(--muted);padding-left:12px;position:relative;margin:3px 0}
.notes li::before{content:"";position:absolute;left:0;top:.65em;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.stay .img{height:120px;border-radius:14px;margin:-4px -4px 14px;position:relative;background:var(--g);overflow:hidden}
.stay .img .emo{position:absolute;right:10px;bottom:-14px;font-size:84px;opacity:.35}
.stay .img .tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.45);color:#fff}
.stay h4{margin:0 0 8px;font-size:16px}
.kv{font-size:13px;color:#cfcdc8;margin:5px 0;display:flex;gap:8px}
.kv i{font-style:normal;width:18px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;border-radius:999px;padding:10px;background:var(--accent);color:#1a1206;font-weight:700;font-size:14px}
.btn.off{background:#26262a;color:var(--muted);pointer-events:none}
.tbd{color:var(--dim)}

/* map list */
.plist .p{display:grid;grid-template-columns:24px 46px 1fr;gap:12px;align-items:center;padding:9px 0;width:100%;text-align:left}
.plist .p .n{width:22px;height:22px;border-radius:50%;background:#26262a;font:600 11px/22px var(--mono);text-align:center;color:var(--muted)}
.plist .p.on .n{background:var(--accent);color:#1a1206}
.plist .p .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--card2)}
.plist .p b{font-size:14px;font-weight:600;display:block}
.plist .p span{font-size:12px;color:var(--muted)}

/* weather */
.wx{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--card);border-radius:999px;padding:12px 0 10px;text-align:center;font-size:11px;color:var(--muted);transition:.2s}
.wd .d{font-family:var(--mono);font-size:10px}
.wd .c{font-size:10px;margin-top:2px}
.wd .e{font-size:19px;margin:6px 0 4px;height:24px}
.wd .bar{width:4px;height:44px;border-radius:2px;background:#2d2d32;margin:0 auto 6px;position:relative;overflow:hidden}
.wd .bar i{position:absolute;left:0;right:0;border-radius:2px;background:var(--accent)}
.wd .hi{color:var(--text);font-family:var(--mono)}
.wd .lo{font-family:var(--mono)}
.wd.on{background:#f3ede4;color:#555}
.wd.on .hi{color:#141414}
.wd.on .bar{background:#ddd5c8}
.wd.on .bar i{background:#111}
.wx-detail{margin-top:10px}
.wx-detail b{font-size:14px}

/* people */
.people{display:grid;grid-template-columns:1fr;gap:10px}
.person{display:flex;gap:12px;align-items:flex-start}
.ava{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#1a1206;background:var(--accent)}
.person .nm{font-weight:600}
.person .ds{font-size:12px;color:var(--muted)}
.dayline{display:flex;gap:3px;margin-top:6px}
.dayline i{width:22px;height:5px;border-radius:3px;background:#2d2d32}
.dayline i.on{background:var(--accent)}
.invite{border:1px dashed #3a3a3f;background:transparent}
.invite pre{white-space:pre-wrap;font:12px/1.7 var(--mono);color:#cfcdc8;background:#18181b;border-radius:12px;padding:12px;margin:10px 0 0}

/* checklist */
.progress{height:3px;border-radius:2px;background:#26262a;margin:6px 0 14px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ck-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ck-tabs button{border-radius:999px;padding:6px 12px;font-size:12px;background:var(--card);color:var(--muted)}
.ck-tabs button small{font-family:var(--mono);margin-left:4px;opacity:.7}
.ck-tabs button.on{background:#f3ede4;color:#141414;font-weight:600}
.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;width:100%;text-align:left}
.ck .box{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #555;margin-top:1px;display:grid;place-items:center;transition:.2s}
.ck.on .box{background:var(--accent);border-color:var(--accent)}
.ck.on .box::after{content:"";width:6px;height:10px;border:solid #1a1206;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck.on .t{text-decoration:line-through;color:var(--muted)}
.ck .t{font-size:14px}
.ck .s{font-size:12px;color:var(--muted)}
.foot{margin-top:36px;font-size:11px;color:var(--dim);text-align:center}

/* ---------- mobile ---------- */
@media (max-width: 900px){
  :root{--map-h:36vh}
  .app{display:flex;flex-direction:column;height:auto}
  .mapwrap{order:-1;position:sticky;top:0;z-index:20;height:var(--map-h);padding:0;background:var(--bg);transition:height .3s ease}
  #map{border-radius:0 0 22px 22px}
  .map-chip{top:calc(10px + env(safe-area-inset-top,0px));left:12px}
  .map-toggle{display:grid;position:absolute;z-index:500;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(14,14,16,.82);border:1px solid #2c2c31;place-items:center}
  .map-toggle svg{width:16px;height:16px;transition:transform .3s}
  body.map-big .mapwrap{--map-h:62vh}
  body.map-big .map-toggle svg{transform:rotate(180deg)}
  .leaflet-control-zoom{display:none}
  .panel{overflow:visible;padding:18px 16px calc(96px + var(--safe-b))}
  .pills{margin:0 -16px;padding:2px 16px 4px}
  .nav{position:fixed;z-index:1000;left:0;right:0;bottom:0;top:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + var(--safe-b));
    border:0;border-top:1px solid #222;background:rgba(11,11,13,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .nav button{width:auto;flex:1;max-width:76px}
  .h1{font-size:28px}
  .today-card{min-height:340px}
  .cd{font-size:44px}
  .wx{gap:4px}
}
@media (max-width: 380px){
  .cd{font-size:38px}
  .seg .tm{font-size:22px}
  .wd .e{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav"></nav>

  <main class="panel" id="panel">
    <section class="view" id="v-today"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-tickets"></section>
    <section class="view" id="v-map"></section>
    <section class="view" id="v-notes"></section>
    <div class="foot" id="foot"></div>
  </main>

  <div class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <div class="map-chip" id="mapchip"></div>
    <button class="map-toggle" id="maptoggle" aria-label="放大/收起地图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</div>

<script src="/libs/leaflet/leaflet.js"></script>
<script>
/* =====================================================================
 *  行程数据 —— 以后更新只改这一段就行
 *  - 时间未定写 time:'待定'，地点坐标不确定就不写 ll（地图上不显示，导航按名称搜索）
 *  - ll 用高德坐标 [纬度, 经度]；approx:true 表示位置是大概的
 *  - 伙伴信息在 PEOPLE，车票在 LEGS，住宿在 STAYS
 * ===================================================================== */
const TRIP = {
  title: '国庆 · 沪宁甬',
  subtitle: '杭州 → 上海 → 南京 → 宁波 → 杭州',
  slogan: '魔都吃吃逛逛，金陵待定，宁波歇脚，最后回家。',
  start: '2026-10-01T00:00:00+08:00',
  updated: '2026-09-29',
};

const CITIES = {
  杭州: { ll: [30.2741, 120.1551], emo: '🍵', g: 'linear-gradient(135deg,#1f4f4a,#0f2a2a 60%,#1d1a14)' },
  上海: { ll: [31.2304, 121.4737], emo: '🌃', g: 'linear-gradient(135deg,#3a2a6a,#1a1840 55%,#3a1f2a)' },
  南京: { ll: [32.0603, 118.7969], emo: '🏯', g: 'linear-gradient(135deg,#5a2a22,#2a1a18 55%,#1f2a1f)' },
  宁波: { ll: [29.8683, 121.5440], emo: '🌊', g: 'linear-gradient(135deg,#1a3f66,#0f2238 55%,#1f2a33)' },
};

/* type: transport 交通 / food 吃饭 / walk 散步逛逛 / fun 玩 / stay 住宿 */
const DAYS = [
  {
    date: '2026-10-01', city: '上海', label: '杭州 → 上海', title: '抵达魔都',
    desc: '白天从杭州出发去上海，晚上泰狮吃泰餐，饭后沿浦东滨江吹吹江风。',
    items: [
      { time: '待定', type: 'transport', title: '杭州 → 上海', sub: '车次待补充', place: '上海虹桥站', city: '上海', ll: [31.1945, 121.3203], approx: true },
      { time: '19:30', type: 'food', title: '晚餐｜Poets Thai 泰狮（滨江店）', sub: '泰餐', place: 'Poets Thai泰狮 滨江店', city: '上海', ll: [31.2352, 121.5018], approx: true },
      { time: '饭后', type: 'walk', title: '浦东滨江散步', sub: '看外滩夜景，走走消食', place: '浦东滨江', city: '上海', ll: [31.2302, 121.5052], approx: true },
    ],
  },
  {
    date: '2026-10-02', city: '上海', label: '上海', title: '看展 · 梧桐区',

function pinIcon(label, on, cls = '') {
  return L.divIcon({ className: '', html: `<div class="pin ${cls} ${on ? 'on' : ''}">${esc(label)}</div>`, iconSize: cls ? null : [26, 26], iconAnchor: cls ? [20, 13] : [13, 13] });
}

}

function drawDay(di) {
  layer.clearLayers(); markers = {};
  if (di === 'all') return drawAll();
  const d = DAYS[di];

    L.marker(c.ll, { icon: pinIcon(d.city, true, 'city') }).addTo(layer).bindPopup(popHtml(d.city, '今天的安排还没定', '', ''));
    fit(a => map.setView(c.ll, 11, { animate: a }));
    return;
  }
  if (pts.length > 1) {
    L.polyline(pts.map(p => p.ll), { color: '#f5a54a', weight: 7, opacity: .18 }).addTo(layer);
    L.polyline(pts.map(p => p.ll), { color: '#f5a54a', weight: 2.5, opacity: .9 }).addTo(layer);
  }
  pts.forEach(p => {
    const m = L.marker(p.ll, { icon: pinIcon(p.n, false), zIndexOffset: 100 }).addTo(layer)
      .bindPopup(popHtml(p.title, (p.approx ? '位置为大概位置 · ' : '') + (p.sub || ''), p.place, p.city));
    m.on('click', () => setActive(di, p.n, false));
    markers[p.n] = m;
  });
  if (pts.length === 1) fit(a => map.setView(pts[0].ll, 13, { animate: a }));
  else fit(a => map.fitBounds(L.latLngBounds(pts.map(p => p.ll)), { padding: [50, 50], animate: a, maxZoom: 14 }));
}

}

function setActive(di, n, fly = true, pop = true) {
  state.active = n;
  Object.entries(markers).forEach(([k, m]) => m.setIcon(pinIcon(k, +k === n)));
  const m = markers[n];
  if (m) {
    if (fly) map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 14), { duration: .6 });
    if (pop) m.openPopup();
  }
  document.querySelectorAll('[data-n]').forEach(el => el.classList.toggle('on', +el.dataset.n === n));
}

/* ---------- shared renderers ---------- */
function pillsHtml(sel, key, withAll) {
  let h = withAll ? `<button class="pill ${sel === 'all' ? 'on' : ''}" data-${key}="all"><small>全程</small>${DAYS.length} 天</button>` : '';
  h += DAYS.map((d, i) => `<button class="pill ${sel === i ? 'on' : ''}" data-${key}="${i}"><small>${md(d.date)}</small>${esc(d.label)}</button>`).join('');
  return `<div class="pills">${h}</div>`;
}

function schedHtml(d, live) {
  if (!d.items.length) return `<div class="empty"><b>TBD</b>这天的计划还没定，有想法群里说～</div>`;
  const now = cnNow();
  const isToday = live && now.date === d.date;
  const nowI = isToday ? currentIdx(d, now.min) : -1;
  return `<div class="sched">${d.items.map((it, i) => {
    const cls = isToday ? (i === nowI ? 'now' : i < nowI ? 'done' : '') : '';
    return `<button class="it ${cls}" ${it.n ? `data-n="${it.n}" data-day="${d.idx}"` : ''}>
      <span class="it-time">${esc(it.time)}</span><span class="it-dot"></span>
      <span><div class="it-t">${esc(it.title)}</div>${it.sub ? `<div class="it-s">${esc(it.sub)}</div>` : ''}</span>
      <span class="it-ico" title="${TYPE[it.type]?.name || ''}">${TYPE[it.type]?.emo || '📍'}</span>
    </button>`;
  }).join('')}</div>`;
}

function currentIdx(d, min) {
  let last = null, idx = 0;
  d.items.forEach((it, i) => {
    const m = parseMin(it.time);
    if (m != null) last = m;
    if (last != null && last <= min) idx = i;
  });
  return idx;
}

/* ---------- 今天 ---------- */
function tripPhase() {
  const now = cnNow();
  if (now.date < DAYS[0].date) return { phase: 'before', di: 0 };
  if (now.date > DAYS[DAYS.length - 1].date) return { phase: 'after', di: DAYS.length - 1 };
  return { phase: 'during', di: DAYS.findIndex(d => d.date === now.date) };
}

        <button class="cbtn" data-feat="-1" aria-label="上一个"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>

      <div class="people">${DAYS.slice(1).map(x => `<button class="card row" data-goto="${x.idx}" style="text-align:left">

  `;

  fillTodayWx();
}

function tickCountdown() {
  const el = $('#cd-wrap'); if (!el) return;
  const { phase, di } = tripPhase();
  if (phase === 'before') {
    let s = Math.max(0, Math.floor((new Date(TRIP.start) - Date.now()) / 1000));
    const dd = Math.floor(s / 86400); s %= 86400;
    const hh = String(Math.floor(s / 3600)).padStart(2, '0'), mm = String(Math.floor(s % 3600 / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
    el.innerHTML = `<div class="cd-l" style="margin-top:6px">距出发还有</div><div class="cd">${dd}<small>天</small>${hh}:${mm}<span style="opacity:.45;font-size:.55em">:${ss}</span></div>`;
  } else if (phase === 'during') {
    el.innerHTML = `<div class="cd-l" style="margin-top:6px">旅途中 · ${esc(DAYS[di].city)}</div><div class="cd">Day ${di + 1}<small>/ ${DAYS.length}</small></div>`;
  } else {
    el.innerHTML = `<div class="cd-l" style="margin-top:6px">旅程结束</div><div class="cd">🏠<small>到家啦</small></div>`;
  }
}

  const dates = [...new Set([...LEGS.map(l => l.date), ...STAYS.map(s => s.checkin), ...STAYS.map(s => s.checkout)])].sort();
  const nextDate = dates.find(d => d >= today);
  let h = `<div class="h1">车票住宿</div><div class="sub">按日期排好：哪天坐哪趟车、住哪家酒店。没定的先写「待补充」。</div><div class="tl">`;
  dates.forEach(date => {
    const legs = LEGS.filter(l => l.date === date);
    const ins = STAYS.filter(s => s.checkin === date);
    const outs = STAYS.filter(s => s.checkout === date);
    h += `<div class="tl-d ${date < today ? 'past' : ''}"><b>${md(date)}</b><span class="sub">${wk(date)}</span>${date === nextDate ? '<span class="tag">下一个</span>' : ''}</div>`;
    outs.forEach(s => { h += `<div class="card sub" style="margin-bottom:12px">退房 · ${s.name ? esc(s.name) : esc(s.city) + '酒店（待补充）'}</div>`; });
    legs.forEach(l => {
      h += `<div class="card leg"><div class="hd">🚄 ${esc(l.from)} → ${esc(l.to)}<span>${l.no ? '' : '待补充'}</span></div>
        <div class="seg">
          <div><div class="tm ${l.dep ? '' : 'tbd'}">${esc(l.dep || '--:--')}</div><div class="st">${esc(l.fromSt)}</div></div>
          <span class="train">${esc(l.no || '车次 TBD')}</span>
          <div class="r"><div class="tm ${l.arr ? '' : 'tbd'}">${esc(l.arr || '--:--')}</div><div class="st">${esc(l.toSt)}</div></div>
        </div>
        ${l.notes?.length ? `<ul class="notes">${l.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div>`;
    });
    ins.forEach(s => {
      const c = CITIES[s.city];
      h += `<div class="card stay" style="margin-bottom:12px">
        <div class="img" style="--g:${c.g}"><span class="tag">入住 · ${esc(s.city)}</span><span class="emo">🛏️</span></div>
        <h4>${s.name ? esc(s.name) : `<span class="tbd">${esc(s.city)}酒店 · 待补充</span>`}</h4>
        <div class="kv"><i>📅</i>${md(s.checkin)} 入住 → ${md(s.checkout)} 退房 · 住 ${nights(s.checkin, s.checkout)} 晚</div>
        ${s.room ? `<div class="kv"><i>🛏️</i>${esc(s.room)}</div>` : ''}
        <div class="kv"><i>📍</i>${s.addr ? esc(s.addr) : '<span class="tbd">地址待补充</span>'}</div>
        ${s.notes?.length ? `<ul class="notes">${s.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
        <a class="btn ${s.name ? '' : 'off'}" href="${s.name ? navUrl(s.name, s.city) : '#'}" target="_blank" rel="noopener">➤ 高德导航</a>
      </div>`;
    });
  });
  $('#v-tickets').innerHTML = h + '</div>';
}

/* ---------- 地图 ---------- */
function renderMap() {
  const sel = state.mapDay;
  let list;
  if (sel === 'all') {
    list = DAYS.map(d => `<button class="p" data-goto-map="${d.idx}"><span class="n">${d.idx + 1}</span><span class="ic">${CITIES[d.city].emo}</span>
      <span><b>${md(d.date)} · ${esc(d.title)}</b><span>${esc(d.label)} · ${d.items.length ? d.items.length + ' 项安排' : 'TBD'}</span></span></button>`).join('');
  } else {
    const d = DAYS[sel];
    const withLL = d.items.filter(i => i.ll), noLL = d.items.filter(i => !i.ll && i.place);
    list = withLL.map(it => `<button class="p" data-n="${it.n}" data-day="${d.idx}"><span class="n">${it.n}</span><span class="ic">${TYPE[it.type]?.emo || '📍'}</span>
      <span><b>${esc(it.title.replace(/^.+?｜/, ''))}</b><span>${esc(TYPE[it.type]?.name || '')} · ${esc(it.time)}${it.approx ? ' · 大概位置' : ''}</span></span></button>`).join('');
    list += noLL.map(it => `<a class="p" href="${navUrl(it.place, it.city)}" target="_blank" rel="noopener"><span class="n">·</span><span class="ic">${TYPE[it.type]?.emo || '📍'}</span>
      <span><b>${esc(it.title.replace(/^.+?｜/, ''))}</b><span>位置待补充 · 点这里高德搜索</span></span></a>`).join('');
    if (!list) list = `<div class="empty"><b>TBD</b>这天还没有地点</div>`;
  }
  $('#v-map').innerHTML = `<div class="h1">地图</div><div class="sub">点地图上的圆点或下面的地点，都能看详情和导航</div>
    <div style="margin-top:14px">${pillsHtml(sel, 'mapday', true)}</div><div class="plist" style="margin-top:10px">${list}</div>`;
  drawDay(sel);
}

/* ---------- 须知 ---------- */
let WX = null;
const WMO = c => c == null ? ['·', '—'] : c === 0 ? ['☀️', '晴'] : c <= 2 ? ['🌤️', '多云'] : c === 3 ? ['☁️', '阴'] : c <= 48 ? ['🌫️', '雾'] :
  c <= 57 ? ['🌦️', '毛毛雨'] : c <= 61 ? ['🌦️', '小雨'] : c <= 63 ? ['🌧️', '中雨'] : c <= 67 ? ['🌧️', '大雨'] : c <= 77 ? ['🌨️', '雪'] :
  c <= 82 ? ['🌦️', '阵雨'] : ['⛈️', '雷雨'];

async function loadWx() {
  if (WX) return WX;
  WX = {};
  const byCity = {};
  DAYS.forEach(d => (byCity[d.city] ||= []).push(d.date));
  await Promise.all(Object.entries(byCity).map(async ([city, dates]) => {
    const [lat, lng] = CITIES[city].ll;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FShanghai&start_date=${dates[0]}&end_date=${dates[dates.length - 1]}`;
    try {
      const r = await fetch(url); if (!r.ok) return;
      const j = await r.json();
      j.daily.time.forEach((t, i) => { if (dates.includes(t)) WX[t] = { code: j.daily.weather_code[i], hi: j.daily.temperature_2m_max[i], lo: j.daily.temperature_2m_min[i], pop: j.daily.precipitation_probability_max[i] }; });
    } catch (e) {}
  }));
  return WX;
}

function wxHtml() {
  const all = DAYS.map(d => WX?.[d.date]).filter(Boolean);
  const tmin = all.length ? Math.min(...all.map(w => w.lo)) - 2 : 10, tmax = all.length ? Math.max(...all.map(w => w.hi)) + 2 : 30;
  const pills = DAYS.map((d, i) => {
    const w = WX?.[d.date]; const [e] = WMO(w?.code);
    const bar = w ? `<i style="bottom:${(w.lo - tmin) / (tmax - tmin) * 100}%;top:${100 - (w.hi - tmin) / (tmax - tmin) * 100}%"></i>` : '';
    return `<button class="wd ${state.wxSel === i ? 'on' : ''}" data-wx="${i}"><div class="d">${md(d.date)}</div><div class="c">${esc(d.city)}</div><div class="e">${e}</div>
      <div class="bar">${bar}</div><div class="hi">${w ? Math.round(w.hi) + '°' : '--'}</div><div class="lo">${w ? Math.round(w.lo) + '°' : ''}</div></button>`;
  }).join('');
  const d = DAYS[state.wxSel], w = WX?.[d.date], [, name] = WMO(w?.code);
  const detail = w
    ? `<b>${md(d.date)} ${esc(d.city)} · ${name}</b><div class="sub" style="margin-top:4px">${Math.round(w.lo)}° ~ ${Math.round(w.hi)}°，降水概率 ${w.pop ?? '--'}%。${w.pop >= 50 ? '大概率下雨，记得带伞。' : w.hi >= 28 ? '白天偏热，穿薄一点。' : w.lo <= 16 ? '早晚偏凉，带件外套。' : '舒服的天气，适合多走走。'}</div>`
    : `<b>${md(d.date)} ${esc(d.city)}</b><div class="sub" style="margin-top:4px">${WX ? '预报暂时拿不到（离得太远或网络原因），临近再看看。' : '天气加载中…'}</div>`;
  return `<div class="wx">${pills}</div><div class="card wx-detail">${detail}<div class="sub" style="font-size:11px;margin-top:8px;color:var(--dim)">数据：Open-Meteo，打开页面时实时拉取</div></div>`;
}

function fillTodayWx() {
  loadWx().then(() => {
    const { di } = tripPhase(); const d = DAYS[di]; const w = WX[d.date]; const el = $('#today-wx');
    if (el && w) el.textContent = `${WMO(w.code)[0]} ${d.city} ${Math.round(w.lo)}–${Math.round(w.hi)}°`;
  });
}

function ckLoad() { try { return JSON.parse(localStorage.getItem('gq-ck') || '{}'); } catch (e) { return {}; } }
function ckSave(v) { try { localStorage.setItem('gq-ck', JSON.stringify(v)); } catch (e) {} }

function renderNotes() {
  const ck = ckLoad();
  const total = Object.values(CHECKLIST).flat().length;
  const done = Object.entries(CHECKLIST).reduce((a, [k, arr]) => a + arr.filter((_, i) => ck[k + i]).length, 0);
  const allDates = DAYS.map(d => md(d.date));
  $('#v-notes').innerHTML = `
    <div class="h1">出行须知</div>
    <div class="sub">${esc(TRIP.subtitle)}<br>${esc(TRIP.slogan)}</div>

    <div class="h2">天气<small>每天所在城市</small></div>
    <div id="wxbox">${wxHtml()}</div>

    <div class="h2">同行伙伴<small>${PEOPLE.length} 人</small></div>
    <div class="people">
      ${PEOPLE.map(p => `<div class="card person"><span class="ava">${esc([...p.name][0])}</span><span style="flex:1">
        <div class="nm">${esc(p.name)}</div><div class="ds">${esc(p.note || '')}</div>
        <div class="dayline">${allDates.map(x => `<i class="${p.days.includes(x) ? 'on' : ''}" title="${x}"></i>`).join('')}</div></span></div>`).join('')}
      <div class="card invite">
        <div style="font-weight:600">一起走的朋友，报一下你的信息 👋</div>
        <div class="sub" style="margin-top:4px">复制下面这段填好发群里，我统一更新到页面上：</div>
        <pre>名字：
参与日期：（如 10/2–10/3）
去程车次 / 到达时间：
返程车次 / 出发时间：
住哪儿：（跟住 / 自己订）
想去的地方、想吃的：</pre>
      </div>
    </div>

    <div class="h2">出行清单<small class="mono">${done} / ${total}</small></div>
    <div class="progress"><i style="width:${done / total * 100}%"></i></div>
    <div class="ck-tabs">${Object.entries(CHECKLIST).map(([k, arr]) =>
      `<button class="${state.ckTab === k ? 'on' : ''}" data-cktab="${esc(k)}">${esc(k)}<small>${arr.filter((_, i) => ck[k + i]).length}/${arr.length}</small></button>`).join('')}</div>
    <div>${CHECKLIST[state.ckTab].map(([t, s], i) =>
      `<button class="ck ${ck[state.ckTab + i] ? 'on' : ''}" data-ck="${i}"><span class="box"></span><span><div class="t">${esc(t)}</div><div class="s">${esc(s)}</div></span></button>`).join('')}</div>
    <div class="sub" style="font-size:11px;margin-top:6px;color:var(--dim)">勾选只保存在你自己的手机上</div>
  `;
  loadWx().then(() => { const b = $('#wxbox'); if (b && state.tab === 'notes') b.innerHTML = wxHtml(); });
}

/* ---------- routing / events ---------- */
const RENDER = { today: renderToday, plan: renderPlan, tickets: renderTickets, map: renderMap, notes: renderNotes };
function show(tab, scroll = true) {
  state.tab = tab;
  try { localStorage.setItem('gq-tab', tab); } catch (e) {}
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  if (tab === 'today') state.featIdx = tripPhase().phase === 'during' ? null : 0;
  if (tab === 'tickets') drawDay(state.day);
  if (tab === 'today') drawDay(tripPhase().di);
  if (tab === 'notes') drawDay('all');
  RENDER[tab]();
  document.body.classList.toggle('map-big', tab === 'map' && innerWidth <= 900);
  setTimeout(refit, 320);
  if (scroll) { $('#panel').scrollTop = 0; if (innerWidth <= 900) scrollTo(0, 0); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return show(ds.tab);
  if (ds.day !== undefined && ds.n === undefined) { state.day = +ds.day; return renderPlan(); }
  if (ds.mapday !== undefined) { state.mapDay = ds.mapday === 'all' ? 'all' : +ds.mapday; return renderMap(); }
  if (ds.gotoMap !== undefined) { state.mapDay = +ds.gotoMap; return renderMap(); }
  if (ds.goto !== undefined) { state.day = +ds.goto; return show('plan'); }
  if (ds.n !== undefined) {
    const di = +ds.day, n = +ds.n;
    const cur = state.tab === 'map' ? state.mapDay : state.tab === 'plan' ? state.day : tripPhase().di;
    if (cur !== di) drawDay(di);
    setActive(di, n);
    if (innerWidth <= 900) scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (ds.feat) {
    const { di } = tripPhase(); const len = Math.max(1, DAYS[di].items.length);
    state.featIdx = ((state.featIdx || 0) + +ds.feat + len) % len; return renderToday();
  }
  if (ds.wx !== undefined) { state.wxSel = +ds.wx; $('#wxbox').innerHTML = wxHtml(); return; }
  if (ds.cktab) { state.ckTab = ds.cktab; return renderNotes(); }
  if (ds.ck !== undefined) { const ck = ckLoad(); const k = state.ckTab + ds.ck; ck[k] = !ck[k]; ckSave(ck); return renderNotes(); }
});

$('#maptoggle').addEventListener('click', () => { document.body.classList.toggle('map-big'); setTimeout(refit, 320); });
addEventListener('resize', () => map.invalidateSize());
$('#foot').textContent = `最后更新 ${TRIP.updated} · 有变动群里说，我来改`;

show(state.tab, false);
</script>
</body>
</html>
